name: ugc-ai

services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ugc_ai}
      POSTGRES_USER: ${POSTGRES_USER:-ugc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ugc_local_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-ugc_user}:${POSTGRES_PASSWORD:-ugc_local_password}@database:5432/${POSTGRES_DB:-ugc_ai}
      CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:?Set VITE_CLERK_PUBLISHABLE_KEY in the root .env file}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?Set CLERK_SECRET_KEY in the root .env file}
      CLERK_WEBHOOK_SIGNING_SECRET: ${CLERK_WEBHOOK_SIGNING_SECRET:?Set CLERK_WEBHOOK_SIGNING_SECRET in the root .env file}
      GOOGLE_CLOUD_API_KEY: ${GOOGLE_CLOUD_API_KEY:?Set GOOGLE_CLOUD_API_KEY in the root .env file}
      GEMINI_IMAGE_MODEL: ${GEMINI_IMAGE_MODEL:-gemini-3-pro-image}
      GEMINI_VIDEO_MODEL: ${GEMINI_VIDEO_MODEL:-veo-3.1-generate-preview}
      CLOUDINARY_URL: ${CLOUDINARY_URL:?Set CLOUDINARY_URL in the root .env file}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_BASEURL: /
        CLERK_PUBLISHABLE_VALUE: ${VITE_CLERK_PUBLISHABLE_KEY:?Set VITE_CLERK_PUBLISHABLE_KEY in the root .env file}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  postgres_data:
